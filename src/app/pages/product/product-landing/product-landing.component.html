<div class="min-h-screen w-full px-4 py-4 md:px-12 lg:px-24">
  <app-search> </app-search>

  <div class="grid w-full grid-cols-2 gap-4 py-8 lg:grid-cols-3 xl:grid-cols-5">
    @for (category of categories; track $index) {
      <div class="col-span-1 h-96">
        <app-item-card
          [item]="category"
          (outputSelected)="onSelectCategories($event)"
        ></app-item-card>
      </div>
    }
  </div>
</div>
