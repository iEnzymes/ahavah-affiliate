<div class="group relative h-full w-full overflow-hidden shadow-lg">
  <div class="flex h-full w-full -translate-y-16 items-center justify-center">
    <img
      [src]="item().image"
      alt=""
      class="h-auto max-h-[260px] w-full shadow-none transition-all duration-500 group-hover:scale-125 group-hover:blur-sm"
    />
  </div>

  <div
    class="absolute bottom-0 flex h-2/5 w-full translate-y-16 transform flex-col bg-white p-4 opacity-100 transition-all duration-500 group-hover:translate-y-0 group-hover:opacity-100"
  >
    <div class="h-3/4 overflow-hidden">
      <span class="line-clamp-2 text-base text-gray-600 lg:text-xl">
        {{ item().name }}
      </span>
    </div>
    <div class="flex h-1/4 w-full items-center justify-end">
      <div
        class="w-32 cursor-pointer rounded-lg bg-[#4A4A4A] py-1 text-center text-white transition-colors duration-300 hover:bg-slate-300 hover:text-black"
      >
        <a
          tabindex="0"
          (click)="outputSelected.emit(item())"
          (keydown.enter)="outputSelected.emit(item())"
          (keydown.space)="outputSelected.emit(item())"
          >SEE MORE</a
        >
      </div>
    </div>
  </div>
</div>
