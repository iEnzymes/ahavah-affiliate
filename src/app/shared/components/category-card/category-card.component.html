<div
  class="group relative h-full w-full items-center justify-center overflow-hidden shadow-lg"
>
  <a href="#">
    <img
      [src]="category().image"
      alt=""
      class="absolute inset-0 h-full w-full object-cover shadow-none transition-all duration-500 group-hover:scale-125 group-hover:blur-sm"
    />
  </a>

  <div
    class="absolute bottom-0 flex h-2/5 w-full translate-y-full transform flex-col bg-white p-4 opacity-0 transition-all duration-500 group-hover:translate-y-0 group-hover:opacity-100"
  >
    <div class="h-3/4 overflow-hidden">
      <span class="line-clamp-2 text-base text-gray-600 lg:text-xl">
        {{ category().name }}
      </span>
    </div>
    <div class="flex h-1/4 w-full items-center justify-end">
      <div
        class="w-32 cursor-pointer rounded-lg bg-[#4A4A4A] py-1 text-center text-white transition-colors duration-300 hover:bg-slate-300 hover:text-black"
      >
        <span class="text-xs lg:text-sm">SEE MORE</span>
      </div>
    </div>
  </div>
</div>
